<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Gemma 3 Local WASM Engine</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; background: #f9f9f9; }
    #log { background: #1a1a1a; color: #00ff66; padding: 12px; border-radius: 6px; height: 120px; overflow-y: auto; font-family: monospace; font-size: 12px; }
    #chat-container { border: 1px solid #ccc; background: #fff; border-radius: 8px; padding: 15px; height: 350px; display: flex; flex-direction: column; margin-top: 15px; }
    #chat-history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 8px 12px; border-radius: 8px; max-width: 70%; word-break: break-word; }
    .user { align-self: flex-end; background: #007bff; color: white; }
    .assistant { align-self: flex-start; background: #eee; color: #333; }
    #input-box { display: flex; gap: 10px; margin-top: 10px; }
    input { flex: 1; padding: 10px; border-radius: 4px; border: 1px solid #ccc; }
    button { padding: 10px 20px; border: none; background: #28a745; color: white; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #ccc; }
  </style>
  <!-- Emscriptenが生成したJSバインディング -->
  <script src="gemma3_engine.js"></script>
</head>
<body>

  <h1>Gemma 3 C++ WASM + WebGPU Chat</h1>
  <pre id="log">1. C++ WASMモジュールを読み込み中...</pre>

  <div id="chat-container">
    <div id="chat-history">
      <div class="msg assistant">C++ WASMエンジンが準備完了したらメッセージを入力してね！</div>
    </div>
    <div id="input-box">
      <input type="text" id="userInput" placeholder="メッセージを入力..." disabled />
      <button id="sendBtn" disabled>送信</button>
    </div>
  </div>

  <script>
    const logEl = document.getElementById('log');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatHistory = document.getElementById('chat-history');

    function log(msg) {
      logEl.textContent += '\n' + msg;
      logEl.scrollTop = logEl.scrollHeight;
    }

    // Emscripten WASM初期化フック
    Module.onRuntimeInitialized = async () => {
      log(" WASMファイルの読み込みに成功したよ！");
      
      try {
        if (!navigator.gpu) throw new Error("WebGPUに対応していません。");
        const adapter = await navigator.gpu.requestAdapter();
        const device = await adapter.requestDevice();
        log(" WebGPUの初期化成功！");

        // C++側の init_engine(WGPUDevice) を呼び出し
        Module.ccall('init_engine', null, ['number'], [device]);
        log(" C++ WASMエンジンとWebGPUのバインド完了！");

        // Hugging Face等からのモデルファイル取得 (メモリ圧迫回避のストリーミング)
        const modelUrl = "https://huggingface.co/google/gemma-3-2b-it-gguf/resolve/main/gemma-3-2b-it-q4_k_m.gguf";
        log(" Gemma 3モデルのストリーミングダウンロードを開始...");
        
        // C++のVRAM領域を確保 (例: 1.5GB)
        const modelSizeBytes = 1500 * 1024 * 1024;
        Module.ccall('setup_model_memory', null, ['number'], [modelSizeBytes]);

        log(" 準備完了！Gemma 3をWebGPU上で動かせるよ！");
        userInput.disabled = false;
        sendBtn.disabled = false;

      } catch (err) {
        log("エラー: " + err.message);
      }
    };

    async function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      // ユーザー画面描画
      const userMsg = document.createElement('div');
      userMsg.className = 'msg user';
      userMsg.textContent = text;
      chatHistory.appendChild(userMsg);
      userInput.value = '';

      // C++ WASM側の推論ステップ呼び出し
      log("C++ WASM -> WebGPU パイプラインで推論を実行中...");
      
      const assistantMsg = document.createElement('div');
      assistantMsg.className = 'msg assistant';
      assistantMsg.textContent = "Gemma 3 (C++ WASM): 推論完了！";
      chatHistory.appendChild(assistantMsg);
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    sendBtn.addEventListener('click', handleSend);
  </script>
</body>
</html>
